# Caelum Microservices Architecture
# Docker Compose configuration for 6 microservices
#
# Services:
# - caelum-api:8000    - API Gateway (entry point)
# - caelum-skyfield:8001 - Astronomical calculations
# - caelum-graph:8002   - Knowledge graph (Neo4j queries)
# - caelum-agent:8003   - LLM conversational AI
# - neo4j:7687          - Neo4j database
# - redis:6379          - Cache

version: '3.8'

services:
  # =========================================================================
  # API Gateway - Single Entry Point
  # =========================================================================
  caelum-api:
    build:
      context: ./services/caelum-api
      dockerfile: Dockerfile
    container_name: caelum_api_gateway
    ports:
      - "8000:8000"
    environment:
      - SKYFIELD_URL=http://caelum-skyfield:8001
      - GRAPH_URL=http://caelum-graph:8002
      - AGENT_URL=http://caelum-agent:8003
      - SERVICE_TIMEOUT=30
    depends_on:
      caelum-skyfield:
        condition: service_healthy
      caelum-graph:
        condition: service_healthy
      caelum-agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - caelum-network

  # =========================================================================
  # Skyfield Service - Astronomical Calculations
  # =========================================================================
  caelum-skyfield:
    build:
      context: ./services/caelum-skyfield
      dockerfile: Dockerfile
    container_name: caelum_skyfield
    ports:
      - "8001:8001"
    volumes:
      - ./services/caelum-skyfield/app/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - caelum-network

  # =========================================================================
  # Graph Service - Knowledge Graph
  # =========================================================================
  caelum-graph:
    build:
      context: ./services/caelum-graph
      dockerfile: Dockerfile
    container_name: caelum_graph
    ports:
      - "8002:8002"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-caelum_password}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - caelum-network

  # =========================================================================
  # Agent Service - LLM Conversational AI
  # =========================================================================
  caelum-agent:
    build:
      context: ./services/caelum-agent
      dockerfile: Dockerfile
    container_name: caelum_agent
    ports:
      - "8003:8003"
    environment:
      - SKYFIELD_URL=http://caelum-skyfield:8001
      - GRAPH_URL=http://caelum-graph:8002
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SERVICE_TIMEOUT=30
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      caelum-skyfield:
        condition: service_healthy
      caelum-graph:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - caelum-network

  # =========================================================================
  # Neo4j Database
  # =========================================================================
  neo4j:
    image: neo4j:5.23.0-community
    container_name: caelum_neo4j_db
    ports:
      - "7474:7474"  # HTTP Web UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-caelum_password}
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-caelum_password}", "MATCH (n) RETURN count(n) LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - caelum-network

  # =========================================================================
  # Redis Cache
  # =========================================================================
  redis:
    image: redis:8.10.3-alpine
    container_name: caelum_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - caelum-network

  # =========================================================================
  # Frontend - React Application
  # =========================================================================
  caelum-frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: caelum_frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      caelum-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - caelum-network

# =========================================================================
# Docker Networks
# =========================================================================
networks:
  caelum-network:
    driver: bridge

# =========================================================================
# Docker Volumes
# =========================================================================
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
